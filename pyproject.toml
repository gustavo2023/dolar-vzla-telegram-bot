[project]
name = "dolar-vzla-telegram-bot"
version = "0.1.0"
description = "Posts USD exchange rates from DolarAPI to a Telegram chat on a schedule"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytelegrambotapi>=4.36.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
