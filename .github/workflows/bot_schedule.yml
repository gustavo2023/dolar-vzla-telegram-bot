name: Run DolarVzlaBot

on:
  schedule:
    # Runs every 15 minutes; main.py only sends during the 09:00-09:15 and
    # 17:00-17:15 VET windows (13:00/21:00 UTC, Venezuela is UTC-4)
    - cron: "*/15 * * * *"
  workflow_dispatch: # Allows manual triggering from GitHub UI

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run bot script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: uv run python main.py